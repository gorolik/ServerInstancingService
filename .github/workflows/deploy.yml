name: Build and Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_TAG: server-instancing-service:latest
  PROJECT_DIR: /opt/airwars/ServerInstancingService
  SERVICE_NAME: airwars-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout исходного кода
        uses: actions/checkout@v4

      - name: 2. Настройка Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 3. Сборка Docker-образа на раннере GitHub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 4. Настройка SSH-ключа для подключения к серверу
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_key
          chmod 600 ~/.ssh/id_key

      - name: 5. Передача compose.yaml, образа и перезапуск
        run: |
          SSH_OPTS="-i ~/.ssh/id_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"

          echo "📁 Создаем директорию на сервере (если ее нет)..."
          ssh $SSH_OPTS ${{ secrets.SERVER_USER }}@${{ secrets.HOST }} "mkdir -p ${{ env.PROJECT_DIR }}"

          echo "📄 Копируем compose.yaml на сервер..."
          scp $SSH_OPTS ./compose.yaml ${{ secrets.SERVER_USER }}@${{ secrets.HOST }}:${{ env.PROJECT_DIR }}/compose.yaml

          echo "🐳 Передаем Docker-образ..."
          docker save ${{ env.IMAGE_TAG }} | zstd -T0 | ssh $SSH_OPTS ${{ secrets.SERVER_USER }}@${{ secrets.HOST }} "zstd -d | docker load"

          echo "🔄 Перезапускаем контейнер..."
          ssh $SSH_OPTS ${{ secrets.SERVER_USER }}@${{ secrets.HOST }} "
            set -e
            cd ${{ env.PROJECT_DIR }}
            docker compose up -d --no-deps ${{ env.SERVICE_NAME }}
            docker image prune -f
          "