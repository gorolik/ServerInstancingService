version: '3.8'

services:
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: aw-docker-proxy
    restart: unless-stopped
    environment:
      # Разрешаем операции управления контейнерами (создание, запуск, чтение статуса)
      - CONTAINERS=1
      - POST=1
      # Обязательно разрешаем DELETE, если бэкенд удаляет контейнеры вручную
      - DELETE=1
      # Разрешаем пинг/версию (Docker.DotNet может запрашивать при старте)
      - VERSION=1
      - PING=1
      
      # Запрещаем монтирование томов хоста, управление сетями хоста, swarms
      - VOLUMES=0
      - NETWORKS=0
      - SYSTEM=0
      - EXEC=0
      - IMAGES=0
    volumes:
      # Только прокси монтирует сокет в режиме Read-Only (ro)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - internal-management
  
  airwars-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: server-instancing-service:latest
    container_name: aw-sis
    ports:
      - "127.0.0.1:5000:8080"
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - GameServer__LauncherType=Docker
      - GameServer__IpAddress=airwars.online
      - DOCKER_HOST=tcp://docker-proxy:2375
    depends_on:
      - docker-proxy
    networks:
      - internal-management
      - default
        
networks:
  # Изолированная сеть без выхода в интернет: только для связи бэкенда и прокси
  internal-management:
    internal: true
