services:
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: aw-docker-proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - POST=1
      - DELETE=1
      - VERSION=1
      - PING=1
      
      - VOLUMES=0
      - NETWORKS=0
      - SYSTEM=0
      - EXEC=0
      - IMAGES=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - internal-management
  
  airwars-backend:
    image: server-instancing-service:latest
    container_name: aw-sis
    ports:
      - "127.0.0.1:5000:8080"
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - DOCKER_HOST=tcp://docker-proxy:2375
      - SSL_CERT_PATH=/etc/letsencrypt/live/your.domain/fullchain.pem
      - SSL_KEY_PATH=/etc/letsencrypt/live/your.domain/privkey.pem
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./config.json:/app/config.json:ro
    depends_on:
      - docker-proxy
    networks:
      - internal-management
      - default
        
networks:
  internal-management:
    internal: true
